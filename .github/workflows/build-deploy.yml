name: Build & Deploy APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-deploy.yml'
  workflow_dispatch:

env:
  API_BASE_URL: http://87.248.150.95/api/v1
  LATEST_URL: http://mahdishafie.ir/updates/economy-latest.apk
  SERVER: 87.248.150.95
  SSH_PORT: '9011'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.22.2
          cache: true

      - name: Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > mobile/android/app/economy-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=economy-release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > mobile/android/key.properties

      - name: Build APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=API_BASE_URL=$API_BASE_URL

      - name: Version
        id: ver
        run: |
          V=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: *//')
          echo "name=${V%%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${V##*+}" >> "$GITHUB_OUTPUT"

      - name: version.json
        env:
          NOTES: ${{ github.event.head_commit.message }}
          VNAME: ${{ steps.ver.outputs.name }}
          VBUILD: ${{ steps.ver.outputs.build }}
        run: |
          python3 -c 'import json,os; print(json.dumps({"versionCode": int(os.environ["VBUILD"]) + 3000, "versionName": os.environ["VNAME"], "notes": os.environ.get("NOTES","").splitlines()[0] if os.environ.get("NOTES") else "", "url": os.environ["LATEST_URL"]}, ensure_ascii=False))' > version.json
          cat version.json

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VBUILD: ${{ steps.ver.outputs.build }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p $SSH_PORT $SERVER >> ~/.ssh/known_hosts
          APK=economy-$VBUILD.apk
          scp -i ~/.ssh/deploy_key -P $SSH_PORT \
            mobile/build/app/outputs/flutter-apk/app-release.apk root@$SERVER:/opt/economy/updates/$APK.tmp
          scp -i ~/.ssh/deploy_key -P $SSH_PORT version.json root@$SERVER:/opt/economy/updates/version.json.tmp
          ssh -i ~/.ssh/deploy_key -p $SSH_PORT root@$SERVER "set -e; cd /opt/economy/updates; \
            mv $APK.tmp $APK; cp $APK economy-latest.apk.tmp; mv economy-latest.apk.tmp economy-latest.apk; \
            mv version.json.tmp version.json; chown economy:economy $APK economy-latest.apk version.json"
