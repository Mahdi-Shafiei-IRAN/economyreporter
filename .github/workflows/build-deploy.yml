name: Build APK

# سرور ایران از GitHub قابل دسترس نیست؛ انتشار روی سرور با deploy/publish-apk.ps1 انجام می‌شود.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-deploy.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.22.2
          cache: true

      - name: Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > mobile/android/app/economy-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=economy-release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > mobile/android/key.properties

      - name: Test & build
        working-directory: mobile
        run: |
          flutter pub get
          flutter test
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=API_BASE_URL=http://87.248.150.95/api/v1

      - uses: actions/upload-artifact@v4
        with:
          name: economy-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
